<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八德耀德扶輪社 第六屆社長暨職員就職典禮電子刊物</title>
  <!-- Swiper 輪播套件 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .swiper {
      width: 100vw;
      height: 100vh;
      max-width: 650px;
    }
    .swiper-slide {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .swiper-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="swiper">
    <div class="swiper-wrapper">
      <!-- 第一頁（封面） -->
      <div class="swiper-slide">
        <img src="cover.jpg" alt="封面 / 第一頁">
      
      <!-- 第二頁 -->
      <div class="swiper-slide">
        <img src="a53141dd-9b66-4334-b733-c50c0835678e.png" alt="第二頁">
      </div>
      
      <!-- 第三頁 -->
      <div class="swiper-slide">
        <img src="就職刊物-01.jpg" alt="第三頁">
      </div>
      
      <!-- 第四頁 -->
      <div class="swiper-slide">
        <img src="11ca9ec8-457b-42b1-b261-659e610364f6.png" alt="第四頁">
      </div>
    </div>

    <!-- 頁碼點點與左右切換箭頭 -->
    <div class="swiper-pagination"></div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
  </div>

  <!-- Swiper 輪播套件 JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper', {
      loop: false,
      pagination: {
        el: '.swiper-pagination',
        clickable: true,
      },
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
    });
  </script>
</body>
</html>
